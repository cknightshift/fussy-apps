<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fussy Apps — fussycat.app</title>
<meta name="description" content="Fussy Apps — carefully crafted by a fussy cat. Featuring FX Convert: convert those currencies, meow.">
<meta name="theme-color" content="#081410">
<meta name="color-scheme" content="dark">
<!-- CSP: this page runs no scripts, forms, or frames — the policy locks it to exactly the assets it uses -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<link rel="canonical" href="https://fussycat.app/">
<meta property="og:title" content="Fussy Apps">
<meta property="og:description" content="Carefully crafted by a fussy cat. Featuring FX Convert: convert those currencies, meow.">
<meta property="og:image" content="https://fussycat.app/fussycat-comic.png">
<meta property="og:image:width" content="624">
<meta property="og:image:height" content="416">
<meta property="og:image:alt" content="Fussy Cat comic for FX Convert">
<meta property="og:url" content="https://fussycat.app/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="fussycat-icon.png">
<link rel="apple-touch-icon" href="fussycat-icon.png">
<!-- Warm the connection to the converter before the visitor taps the button -->
<link rel="preconnect" href="https://convert.fussycat.app">
<style>
  :root {
    --bg: #081410;
    --bg-deep: #060f0c;
    --card: #0c201a;
    --card-edge: #1c3a32;
    --teal: #3ee6c8;
    --plum: #b04e90;
    --rose-light: #c9659f;
    --ink: #eaf6f2;
    --mut: #7fa89e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* Dark base painted behind everything: no white flash on mobile
     overscroll bounce. overflow-anchor on html — the document's
     actual scroll container — unplugs Chrome's scroll anchoring
     machinery: useful on long articles, pure nuisance here */
  html {
    background-color: var(--bg);
    overscroll-behavior-y: none;
    overflow-anchor: none;
  }
  body {
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 20% 0%, rgba(62,230,200,.10), transparent 60%),
      radial-gradient(1000px 500px at 85% 100%, rgba(176,78,144,.07), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 55%, var(--bg) 100%);
    background-attachment: fixed;
    /* svh sizes the page to the smallest the viewport can be, so the
       collapsing mobile URL bar never resizes the page mid-scroll —
       nothing for Chrome's scroll anchoring to grip (vh kept as the
       old-browser fallback) */
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 18px;
    color-scheme: dark;
  }
  /* Touch devices: scroll the background with the page. Fixed
     attachment forces repaints on Android Chrome during the URL-bar
     transition; the dark html backdrop keeps the look identical.
     Deliberate tradeoff: iPadOS with a mouse attached reports a fine
     pointer and slips past this gate — accepted, so desktop Safari
     on macOS keeps the pinned gradient */
  @media (pointer: coarse) {
    body { background-attachment: scroll; }
  }
  /* Centring wrapper: safe centring that never clips the top when
     content is taller than the window, while keeping the landmark
     elements (header/main/footer) siblings rather than nesting them
     inside main, so screen readers expose the landmarks properly */
  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-block: auto;
  }
  /* Text selection joins the palette: teal highlight over dark ink */
  ::selection { background-color: var(--teal); color: var(--bg); }

  h1, h2 { text-wrap: balance; }

  .badge,
  .comic {
    height: auto;
    display: block;
  }
  .badge {
    width: min(375px, 88vw);
    margin-bottom: 26px;
  }
  .comic {
    width: min(620px, 94vw);
    border-radius: 14px;
    border: 1px solid var(--card-edge);
    box-shadow: 0 18px 50px rgba(0,0,0,.55);
    margin-bottom: 34px;
  }
  .app-card {
    width: min(620px, 94vw);
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 18px;
    padding: 30px 28px;
    text-align: center;
    box-shadow: 0 14px 40px rgba(0,0,0,.45);
  }
  .app-card h2 {
    font-size: clamp(19px, 3vw, 24px);
    font-weight: 600;
    letter-spacing: .14em;
    margin-right: -.14em; /* optical centreing: cancel the trailing letter-space */
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .app-card h2 .tick { color: var(--teal); }
  /* Streamlined, legible description font */
  .app-card p {
    font-family: system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    font-weight: 480;
    line-height: 1.65;
    letter-spacing: .005em;
    color: var(--mut); /* fallback for older browsers */
    color: color-mix(in srgb, var(--ink) 52%, var(--mut));
    max-width: 44ch;
    margin: 0 auto 24px;
    text-wrap: pretty;
  }
  .launch-btn {
    display: inline-block;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: .08em;
    margin-right: -.08em; /* optical centreing for the uppercase label */
    text-transform: uppercase;
    color: #ffe9f6;
    background: linear-gradient(180deg, var(--rose-light) 0%, var(--plum) 55%, #8a305f 100%);
    border: 1px solid #5e1d47;
    border-radius: 999px;
    padding: 14px 34px;
    box-shadow: inset 0 1px 0 rgba(232,196,106,.14), 0 8px 22px rgba(176,78,144,.25);
    transition: transform .15s ease, filter .15s ease;
    /* native-app feel on touch: no gray tap ghost, no double-tap zoom pause */
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .launch-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .launch-btn:active { transform: translateY(0); }
  footer {
    margin-top: 30px;
    font-size: 12px;
    letter-spacing: .12em;
    margin-right: -.12em; /* optical centreing for the uppercase footer */
    color: var(--rose-light);
    text-transform: uppercase;
    text-align: center;
  }
  footer a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px dotted var(--rose-light);
    transition: color .15s ease, border-color .15s ease;
  }
  footer a:hover { color: var(--teal); border-bottom-color: var(--teal); }
  .ver {
    display: block;
    margin-top: 6px;
    text-transform: none; /* the stamp keeps its lowercase 'v' */
  }

  /* Keyboard users get a clear focus ring; mouse users see nothing extra */
  a:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 4px;
    border-radius: 4px;
  }
  /* Respect the operating-system "reduce motion" preference */
  @media (prefers-reduced-motion: reduce) {
    .launch-btn, footer a { transition: none; }
    .launch-btn:hover { transform: none; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- Masthead: the badge is the site's true headline -->
  <header>
    <h1>
      <img class="badge" src="fussycat-app-badge.svg" width="375" height="250"
           decoding="async"
           alt="Fussy Apps — fussycat.app">
    </h1>
  </header>

  <!-- The comic: resolution tiering via srcset — low-DPR displays fetch
       the compact PNG, high-DPR displays (most phones, retina screens)
       fetch the full WEBP. The default src is the PNG so even a
       srcset-less browser renders it -->
  <img class="comic" src="fussycat-comic.png"
       srcset="fussycat-comic.png 624w, fussycat-comic.webp 1248w"
       sizes="(min-width: 640px) 620px, 94vw"
       width="1248" height="832"
       decoding="async" fetchpriority="high"
       alt="Fussy Cat comic: FX Convert — AUD 9 gives NZD 11.01">

  <!-- Featured app card -->
  <main>
    <section class="app-card">
      <h2>FX<span class="tick">·</span>CONVERT</h2>
      <p>A fussy little currency converter. Four ready-made NZD pairs, plus one custom card that lets you pick from 22 currencies… lucky!</p>
      <a class="launch-btn" href="https://convert.fussycat.app/">Open FX Convert</a>
    </section>
  </main>

  <footer>fussycat.app · crafted by <a href="https://github.com/cknightshift" target="_blank" rel="noopener noreferrer nofollow">cknightshift</a>
  <span class="ver">v10.45</span></footer>

</div>

</body>
</html>
